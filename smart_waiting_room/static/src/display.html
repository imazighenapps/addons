<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Waiting Room Display</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════════════
   RESET & ROOT VARIABLES
═══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Palette — deep navy + electric blue + white */
  --bg:         #05080f;
  --panel:      #0a0f1c;
  --card:       #0f1628;
  --card-hi:    #111c32;
  --b:          rgba(255,255,255,0.09);
  --b2:         rgba(255,255,255,0.16);

  /* Accent colors — full saturation, no grey-mixing */
  --blue:       #3d9bff;
  --blue-dim:   rgba(61,155,255,0.14);
  --blue-glow:  rgba(61,155,255,0.30);
  --green:      #00e676;
  --green-dim:  rgba(0,230,118,0.12);
  --amber:      #ffab00;
  --red:        #ff3d3d;
  --purple:     #c77dff;
  --purple-dim: rgba(199,125,255,0.14);

  /* Typography — white/near-white only */
  --t1: #ffffff;           /* primary — pure white */
  --t2: rgba(255,255,255); /* secondary */
  --t3: rgba(255,255,255); /* muted */
  --t4: rgba(255,255,255); /* very dim */

  --font:  'Barlow', sans-serif;
  --cond:  'Barlow Condensed', sans-serif;
  --mono:  'JetBrains Mono', monospace;
}

html,body{
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  color:var(--t1);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════════════════════════════
   PAGE LAYOUT
═══════════════════════════════════════════════════════════════════ */
#root{
  display:grid;
  grid-template-rows:72px 1fr 40px;
  height:100vh; width:100vw;
}

/* Subtle ambient light */
body::before{
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 55% 45% at 25% 55%, rgba(61,155,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 45% 55% at 75% 25%, rgba(0,230,118,.05) 0%, transparent 55%);
}

/* ═══════════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════════ */
header{
  position:relative; z-index:10;
  display:flex; align-items:center;
  padding:0 28px; gap:20px;
  background:var(--panel);
  border-bottom:1px solid var(--b2);
  flex-shrink:0;
}

.hdr-brand{
  display:flex; align-items:center; gap:12px;
  min-width:220px; flex-shrink:0;
}
.hdr-ico{
  width:38px; height:38px; border-radius:10px;
  background:var(--blue);
  display:flex; align-items:center; justify-content:center;
}
.hdr-ico svg{
  width:22px; height:22px;
  stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
}
.hdr-room{
  font-family:var(--cond);
  font-size:20px; font-weight:800;
  letter-spacing:.03em; color:var(--t1);
  line-height:1;
}
.hdr-live{
  display:flex; align-items:center; gap:5px;
  font-size:10px; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:var(--green);
  margin-top:3px;
}
.live-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.hdr-msg{
  flex:1; text-align:center;
  font-size:15px; font-weight:500;
  color:var(--t3); font-style:italic;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}

.hdr-right{
  display:flex; align-items:center; gap:24px;
  min-width:260px; justify-content:flex-end; flex-shrink:0;
}
.hdr-kpis{display:flex; gap:20px;}
.kpi{text-align:center;}
.kpi-n{
  font-family:var(--mono);
  font-size:22px; font-weight:700; line-height:1;
}
.kpi-n.blue{color:var(--blue);}
.kpi-n.green{color:var(--green);}
.kpi-l{
  font-size:9px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--t4); margin-top:2px;
}
.hdr-clock{ text-align:right; }
#clk{
  font-family:var(--mono);
  font-size:26px; font-weight:700; letter-spacing:.04em;
  color:var(--t1); line-height:1;
}
#clkd{
  font-size:10px; letter-spacing:.06em;
  color:var(--t4); margin-top:2px; text-transform:uppercase;
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN — 2 columns: WAITING LIST left | NOW SERVING right
═══════════════════════════════════════════════════════════════════ */
main{
  position:relative; z-index:5;
  display:grid;
  grid-template-columns:1.15fr 1px 1fr;
  overflow:hidden;
}
.divider{ background:var(--b2); }

/* ─── SECTION HEADING ───────────────────────────────────────────── */
.sec-head{
  display:flex; align-items:center; gap:10px;
  margin-bottom:16px; flex-shrink:0;
}
.sec-lbl{
  font-family:var(--cond);
  font-size:11px; font-weight:800; letter-spacing:.25em; text-transform:uppercase;
  white-space:nowrap;
}
.sec-rule{ flex:1; height:1px; }
.sec-head.dim .sec-lbl{ color:var(--t4); }
.sec-head.dim .sec-rule{ background:var(--b); }
.sec-head.blue .sec-lbl{ color:var(--blue); }
.sec-head.blue .sec-rule{ background:linear-gradient(90deg,rgba(61,155,255,.5),transparent); }
.sec-head.green .sec-lbl{ color:var(--green); }
.sec-head.green .sec-rule{ background:linear-gradient(90deg,rgba(0,230,118,.4),transparent); }

/* ═══════════════════════════════════════════════════════════════════
   LEFT PANEL — WAITING LIST
═══════════════════════════════════════════════════════════════════ */
.left{
  display:flex; flex-direction:column;
  padding:18px 22px;
  gap:10px; overflow:hidden;
}

/* Column headers */
.wl-cols{
  display:grid;
  grid-template-columns:36px 90px 1fr 120px 80px;
  gap:8px; padding:0 12px 8px;
  font-family:var(--cond);
  font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--t4);
  border-bottom:1px solid var(--b);
  flex-shrink:0;
}

/* List area — NO innerHTML wipe = no flicker */
#wlist{
  display:flex; flex-direction:column;
  gap:5px; flex:1; overflow:hidden;
}

/* Individual row */
.wrow{
  display:grid;
  grid-template-columns:36px 90px 1fr 120px 80px;
  gap:8px; padding:11px 12px;
  border-radius:8px;
  background:var(--card);
  border:1px solid transparent;
  align-items:center;
  transition:background .3s ease, border-color .3s ease, opacity .4s ease;
}
.wrow-new{ animation:row-enter .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes row-enter{
  from{opacity:0; transform:translateX(-14px);}
  to{opacity:1; transform:translateX(0);}
}
.wrow.next{
  background:var(--blue-dim);
  border-color:rgba(61,155,255,.35);
}
.wrow.is-vip{
  background:var(--purple-dim);
  border-color:rgba(199,125,255,.3);
}
.wrow.is-urgent{
  background:rgba(255,61,61,.08);
  border-color:rgba(255,61,61,.3);
}
.wrow.is-late{
  box-shadow:inset 0 0 0 1.5px rgba(255,61,61,.5);
}

.wr-pos{
  font-family:var(--mono); font-size:13px; font-weight:600;
  color:var(--t4); text-align:center;
}
.wrow.next .wr-pos{ color:var(--blue); }

.wr-tok{
  font-family:var(--mono); font-size:15px; font-weight:700;
  color:var(--blue);
}
.wr-name{
  font-family:var(--font); font-size:15px; font-weight:600;
  color:var(--t1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.wr-dept{
  font-size:13px; font-weight:500; color:var(--t3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.wr-wait{
  font-family:var(--mono); font-size:13px; font-weight:600;
  color:var(--t3); text-align:right;
}
.wr-wait.soon{ color:var(--green); }
.wr-wait.long{ color:var(--amber); }

.wl-empty{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  flex:1; gap:10px; color:var(--t4);
}
.wl-empty-ico{ font-size:2.5rem; opacity:.2; }
.wl-empty-txt{ font-size:14px; letter-spacing:.05em; }
.more-badge{
  text-align:center; font-size:11px; color:var(--t4);
  padding:6px; letter-spacing:.1em;
}

/* Stats strip */
.stats{
  display:flex; align-items:center; justify-content:center;
  gap:24px; padding:8px 0 2px;
  border-top:1px solid var(--b);
  flex-shrink:0;
}
.stat-it{ display:flex; align-items:baseline; gap:7px; }
.stat-n{
  font-family:var(--mono); font-size:20px; font-weight:700; color:var(--t1);
}
.stat-l{
  font-size:9px; text-transform:uppercase; letter-spacing:.13em; color:var(--t4);
}
.stat-sep{ color:var(--b2); font-size:1.2rem; }

/* ═══════════════════════════════════════════════════════════════════
   RIGHT PANEL — NOW SERVING + PLEASE PROCEED
═══════════════════════════════════════════════════════════════════ */
.right{
  display:flex; flex-direction:column;
  padding:18px 22px;
  gap:16px; overflow:hidden;
}

/* ─── NOW SERVING SPOTLIGHT ────────────────────────────────────── */
#now-serving{
  background:var(--blue-dim);
  border:1.5px solid rgba(61,155,255,.30);
  border-radius:14px;
  position:relative; overflow:hidden;
  flex-shrink:0;
  min-height:120px;
  /* CSS transition for content changes — no flicker */
  transition:border-color .4s ease;
}
/* Animated sweep on top edge */
#now-serving::after{
  content:'';
  position:absolute; top:0; left:-100%; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  animation:sweep 4s linear infinite;
}
@keyframes sweep{ 0%{left:-100%} 100%{left:200%} }

.ns-empty{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:120px; gap:10px; color:var(--t4);
}
.ns-empty-ico{ font-size:2.8rem; opacity:.22; }
.ns-empty-txt{
  font-family:var(--cond); font-size:14px; letter-spacing:.08em; text-transform:uppercase;
}

.ns-inner{
  padding:20px 24px;
  display:flex; align-items:center; gap:20px;
}

/* Big token box */
.ns-tok-box{
  background:rgba(61,155,255,.18);
  border:1.5px solid rgba(61,155,255,.4);
  border-radius:10px;
  padding:14px 20px;
  text-align:center; flex-shrink:0;
}
.ns-tok{
  font-family:var(--mono);
  font-size:3.4rem; font-weight:700;
  color:var(--blue); line-height:1; letter-spacing:-.02em;
}
.ns-tok-lbl{
  font-family:var(--cond);
  font-size:9px; font-weight:700;
  text-transform:uppercase; letter-spacing:.2em;
  color:var(--t4); margin-top:4px;
}
.ns-info{ flex:1; min-width:0; }
.ns-name{
  font-family:var(--cond);
  font-size:2rem; font-weight:800;
  color:var(--t1); line-height:1.1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ns-dept{
  display:inline-block; margin-top:7px;
  font-family:var(--cond);
  font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 12px; border-radius:6px;
  background:rgba(61,155,255,.18);
  color:var(--blue);
  border:1px solid rgba(61,155,255,.38);
}
.ns-waited{
  font-size:13px; font-weight:500; color:var(--t3); margin-top:6px;
}
.ns-badge-area{ flex-shrink:0; }

/* Priority badges */
.badge{
  font-family:var(--cond);
  font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  padding:5px 12px; border-radius:6px;
  display:inline-block;
}
.b-vip{
  background:rgba(199,125,255,.22); color:#e0b5ff;
  border:1px solid rgba(199,125,255,.45);
}
.b-urgent{
  background:rgba(255,61,61,.22); color:#ff9a9a;
  border:1px solid rgba(255,61,61,.45);
  animation:urg 1s ease infinite;
}
.b-prio{
  background:rgba(255,171,0,.2); color:#ffd47a;
  border:1px solid rgba(255,171,0,.45);
}
@keyframes urg{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── PLEASE PROCEED ────────────────────────────────────────────── */
#called-section{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }

.called-card{
  background:var(--purple-dim);
  border:1px solid rgba(199,125,255,.30);
  border-radius:9px;
  padding:12px 16px;
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:14px;
}
.c-tok{
  font-family:var(--mono); font-size:1.4rem; font-weight:700;
  color:var(--purple);
}
.c-name{
  font-family:var(--font); font-size:15px; font-weight:600;
  color:var(--t1);
}
.c-arrow{
  font-family:var(--cond);
  font-size:12px; font-weight:700; letter-spacing:.06em;
  color:var(--purple); white-space:nowrap;
  animation:arr 1.5s ease infinite;
}
@keyframes arr{
  0%,100%{opacity:1; transform:translateX(0)}
  50%{opacity:.4; transform:translateX(5px)}
}

/* ═══════════════════════════════════════════════════════════════════
   FOOTER TICKER
═══════════════════════════════════════════════════════════════════ */
footer{
  position:relative; z-index:10;
  display:flex; align-items:center;
  background:var(--panel); border-top:1px solid var(--b2);
  overflow:hidden; flex-shrink:0;
}
.ticker-outer{
  flex:1; overflow:hidden; height:100%;
  display:flex; align-items:center;
}
.ticker-inner{
  white-space:nowrap;
  animation:tick 60s linear infinite;
  font-size:13px; font-weight:500;
  color:var(--t3); letter-spacing:.04em;
}
.ticker-inner.paused{ animation-play-state:paused; }
@keyframes tick{ from{transform:translateX(100vw)} to{transform:translateX(-100%)} }
.tick-sep{
  color:rgba(61,155,255,.6);
  padding:0 22px; font-size:.85em;
}
.foot-brand{
  padding:0 18px; height:100%;
  display:flex; align-items:center;
  font-family:var(--cond);
  font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
  color:var(--t4);
  border-left:1px solid var(--b);
  flex-shrink:0;
}

/* ═══════════════════════════════════════════════════════════════════
   CALL OVERLAY — spectacular 3-phase animation
   Phase 1: edge flash bars + screen dim
   Phase 2: expanding arc rings
   Phase 3: card pops up with giant token
═══════════════════════════════════════════════════════════════════ */
#overlay{
  position:fixed; inset:0; z-index:1000;
  display:none; align-items:center; justify-content:center;
  background:rgba(5,8,15,.92);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
#overlay.show{ display:flex; }

/* Edge flash bars */
.fb{ position:absolute; background:var(--blue); opacity:0; }
.fb-t{ top:0;left:0;right:0;height:4px; animation:fb .7s ease; }
.fb-b{ bottom:0;left:0;right:0;height:4px; animation:fb .7s .1s ease; }
.fb-l{ top:0;left:0;bottom:0;width:4px; animation:fb .7s .05s ease; }
.fb-r{ top:0;right:0;bottom:0;width:4px; animation:fb .7s .05s ease; }
@keyframes fb{
  0%{opacity:0} 25%{opacity:1} 75%{opacity:1} 100%{opacity:0}
}

/* Arc rings */
.arc-wrap{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.arc{
  position:absolute; border-radius:50%;
  border:2px solid rgba(61,155,255,.5);
  animation:arc-out 2.5s ease-out infinite;
}
.arc:nth-child(2){ animation-delay:.8s; }
.arc:nth-child(3){ animation-delay:1.6s; }
@keyframes arc-out{
  0%{  width:80px;  height:80px;  opacity:.9; border-color:rgba(61,155,255,.8); }
  100%{width:900px; height:900px; opacity:0;  border-color:rgba(61,155,255,0); }
}

/* Main card */
.ov-card{
  position:relative; z-index:2;
  background:var(--panel);
  border:2px solid rgba(61,155,255,.5);
  border-radius:20px;
  padding:48px 80px;
  text-align:center;
  min-width:480px;
  box-shadow:
    0 0 120px rgba(61,155,255,.18),
    0 40px 80px rgba(0,0,0,.7);
  animation:card-in .55s cubic-bezier(.34,1.56,.64,1);
}
.ov-card.out{ animation:card-out .4s ease forwards; }
@keyframes card-in{
  from{transform:scale(.55) translateY(60px); opacity:0}
  to{transform:scale(1) translateY(0); opacity:1}
}
@keyframes card-out{
  from{transform:scale(1); opacity:1}
  to{transform:scale(.85); opacity:0}
}

.ov-now{
  font-family:var(--cond);
  font-size:11px; font-weight:800; letter-spacing:.3em; text-transform:uppercase;
  color:var(--t4); margin-bottom:20px;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.ov-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--blue); box-shadow:0 0 12px var(--blue);
  animation:blink 1s infinite;
}

.ov-token{
  font-family:var(--mono);
  font-size:7.5rem; font-weight:700;
  color:var(--blue); line-height:1; letter-spacing:-.02em;
  text-shadow:0 0 80px rgba(61,155,255,.6);
  animation:tok-pop .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes tok-pop{
  from{transform:scale(.3); opacity:0}
  to{transform:scale(1); opacity:1}
}

.ov-name{
  font-family:var(--cond); font-size:2.4rem; font-weight:800;
  color:var(--t1); margin:14px 0 5px; letter-spacing:.02em;
}
.ov-dept{
  font-family:var(--cond);
  font-size:13px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--blue); margin-bottom:20px;
}
.ov-sub{
  font-size:14px; font-weight:500; color:var(--t3);
  border-top:1px solid var(--b); padding-top:16px; letter-spacing:.03em;
}
.ov-bar-wrap{
  height:4px; background:rgba(61,155,255,.12);
  border-radius:2px; margin-top:18px; overflow:hidden;
}
.ov-bar{
  height:100%;
  background:linear-gradient(90deg, var(--blue), rgba(61,155,255,.4));
  border-radius:2px; width:100%;
  animation:drain linear forwards;
}
@keyframes drain{from{width:100%}to{width:0}}
</style>
</head>
<body>

<div id="root">

  <!-- ── HEADER ────────────────────────────────────────────────────── -->
  <header>
    <div class="hdr-brand">
      <div class="hdr-ico">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
      </div>
      <div>
        <div class="hdr-room" id="hdr-room">Waiting Room</div>
        <div class="hdr-live"><span class="live-dot"></span>LIVE</div>
      </div>
    </div>
    <div class="hdr-msg" id="hdr-msg">Welcome — please take a seat</div>
    <div class="hdr-right">
      <div class="hdr-kpis">
        <div class="kpi">
          <div class="kpi-n blue" id="kpi-w">0</div>
          <div class="kpi-l">Waiting</div>
        </div>
        <div class="kpi">
          <div class="kpi-n green" id="kpi-s">0</div>
          <div class="kpi-l">Served Today</div>
        </div>
      </div>
      <div class="hdr-clock">
        <div id="clk">--:--</div>
        <div id="clkd">---</div>
      </div>
    </div>
  </header>

  <!-- ── MAIN ──────────────────────────────────────────────────────── -->
  <main>

    <!-- ════ LEFT: WAITING LIST ════ -->
    <div class="left">

      <div class="sec-head dim">
        <span class="sec-lbl">Waiting List</span>
        <span class="sec-rule"></span>
      </div>

      <div class="wl-cols">
        <span>#</span>
        <span>Token</span>
        <span>Name</span>
        <span>Service</span>
        <span style="text-align:right">Est.</span>
      </div>

      <div id="wlist"></div>

      <div class="stats">
        <div class="stat-it">
          <span class="stat-n" id="st-total">0</span>
          <span class="stat-l">In Queue</span>
        </div>
        <span class="stat-sep">·</span>
        <div class="stat-it">
          <span class="stat-n" id="st-avg">0</span>
          <span class="stat-l">Avg Wait (min)</span>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <!-- ════ RIGHT: NOW SERVING + PLEASE PROCEED ════ -->
    <div class="right">

      <div class="sec-head blue">
        <span class="sec-lbl">Now Serving</span>
        <span class="sec-rule"></span>
      </div>

      <div id="now-serving">
        <div class="ns-empty">
          <div class="ns-empty-ico">⏳</div>
          <div class="ns-empty-txt">Awaiting next call…</div>
        </div>
      </div>

      <div id="called-wrap-section" style="display:none; flex-direction:column; gap:8px;">
        <div class="sec-head green" style="margin-bottom:2px">
          <span class="sec-lbl">Please Proceed</span>
          <span class="sec-rule"></span>
        </div>
        <div id="called-list"></div>
      </div>

    </div>

  </main>

  <!-- ── FOOTER TICKER ──────────────────────────────────────────────── -->
  <footer>
    <div class="ticker-outer">
      <div class="ticker-inner" id="ticker-inner">
        <!-- Built by JS from configurable ticker_messages -->
      </div>
    </div>
    <div class="foot-brand">Smart Waiting Room</div>
  </footer>

</div><!-- #root -->

<!-- ── CALL OVERLAY ────────────────────────────────────────────────── -->
<div id="overlay">
  <div class="fb fb-t"></div>
  <div class="fb fb-b"></div>
  <div class="fb fb-l"></div>
  <div class="fb fb-r"></div>
  <div class="arc-wrap">
    <div class="arc"></div>
    <div class="arc"></div>
    <div class="arc"></div>
  </div>
  <div class="ov-card" id="ov-card">
    <div class="ov-now">
      <span class="ov-dot"></span>
      NOW CALLING
      <span class="ov-dot"></span>
    </div>
    <div class="ov-token" id="ov-tok">T001</div>
    <div class="ov-name" id="ov-name">—</div>
    <div class="ov-dept" id="ov-dept"></div>
    <div class="ov-sub">Please proceed to the service desk</div>
    <div class="ov-bar-wrap"><div class="ov-bar" id="ov-bar"></div></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════════
   CONFIG & STATE
════════════════════════════════════════════════════════════════ */
var POLL    = 5000;
var OV_DUR  = 7000;
var MAX_ROW = 12;

var ROOM      = __ROOM_DATA__;
var API_TOKEN = ROOM.token || '';
var audioOn   = ROOM.audio_enabled !== false;
/* Whether to show visitor names on the public display.
   Loaded from room settings; updated on every poll. */
var showName  = ROOM.show_visitor_name !== false;

/* DOM snapshot — key: row id, value: rendered key string
   Used for diffing so we never wipe the whole list */
var wlistState   = {};   // id → "key"
var servingState = '';   // serialized key of current serving
var calledState  = {};   // id → key

var prevServingIds = {};
var prevCalledIds  = {};
var ovActive  = false;
var ovTimer   = null;

/* ════════════════════════════════════════════════════════════════
   CLOCK
════════════════════════════════════════════════════════════════ */
function updateClock(){
  var n = new Date();
  var h = n.getHours().toString().padStart(2,'0');
  var m = n.getMinutes().toString().padStart(2,'0');
  setText('clk', h + ':' + m);
  setText('clkd', n.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase());
}
setInterval(updateClock, 1000);
updateClock();

/* ════════════════════════════════════════════════════════════════
   INIT — apply room static data
════════════════════════════════════════════════════════════════ */
setText('hdr-room', ROOM.room_name || 'Waiting Room');
setText('hdr-msg',  ROOM.welcome_message || 'Welcome');
buildTicker(ROOM.ticker_messages || 'Thank you for your patience.');

/* ════════════════════════════════════════════════════════════════
   TICKER — built from pipe-separated messages
════════════════════════════════════════════════════════════════ */
function buildTicker(raw){
  var msgs = raw.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
  if(!msgs.length) msgs = ['Thank you for your patience.'];
  // Duplicate content so scroll feels seamless
  var content = (msgs.concat(msgs)).map(function(m){
    return '<span>' + esc(m) + '</span><span class="tick-sep">◆</span>';
  }).join('');
  var el = document.getElementById('ticker-inner');
  if(el) el.innerHTML = content;
}

/* ════════════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════════════ */
function setText(id, val){
  var el = document.getElementById(id);
  if(el && el.textContent !== val) el.textContent = val;
}
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Returns the display name respecting the showName setting.
   When names are hidden we show only the first letter + dots,
   so the patient still knows it's them without exposing their
   full name to others in the waiting room. */
function visitorName(it){
  if(showName) return esc(it.name || '');
  var n = (it.name || '').trim();
  if(!n) return '—';
  return esc(n.charAt(0).toUpperCase() + '. ···');
}
/* For TTS — when names are hidden, say nothing personal. */
function spokenName(it){
  if(showName) return it.name;
  return '';   // token number is enough
}
function rowKey(it){
  return it.token + '|' + it.name + '|' + it.state + '|' + it.priority +
         '|' + it.department + '|' + it.estimated_wait + '|' + (it.is_late?1:0);
}

/* ════════════════════════════════════════════════════════════════
   AUDIO TTS
════════════════════════════════════════════════════════════════ */
function speak(txt){
  if(!audioOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(txt);
  u.rate=.85; u.pitch=1; u.volume=1;
  var v = window.speechSynthesis.getVoices().find(function(x){
    return x.name.includes('Google UK') || x.name.includes('Daniel') ||
           x.name.includes('Google') || x.lang.startsWith('en');
  });
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}

/* ════════════════════════════════════════════════════════════════
   OVERLAY
════════════════════════════════════════════════════════════════ */
function showOverlay(item){
  if(ovActive) return;
  ovActive = true;
  var ov   = document.getElementById('overlay');
  var card = document.getElementById('ov-card');
  var bar  = document.getElementById('ov-bar');
  setText('ov-tok',  item.token);
  setText('ov-name', showName ? item.name : '');
  setText('ov-dept', item.department || '');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = 'drain ' + OV_DUR + 'ms linear forwards';
  card.classList.remove('out');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'card-in .55s cubic-bezier(.34,1.56,.64,1)';
  ov.classList.add('show');
  clearTimeout(ovTimer);
  ovTimer = setTimeout(function(){
    card.classList.add('out');
    setTimeout(function(){ ov.classList.remove('show'); ovActive = false; }, 440);
  }, OV_DUR);
}

/* ════════════════════════════════════════════════════════════════
   RENDER NOW SERVING — diff-based, no full wipe
════════════════════════════════════════════════════════════════ */
function renderServing(items){
  var el  = document.getElementById('now-serving');
  var key = items.length ? rowKey(items[0]) : '__empty__';
  if(servingState === key) return;   // nothing changed → skip
  servingState = key;

  if(!items.length){
    el.innerHTML = '<div class="ns-empty"><div class="ns-empty-ico">⏳</div><div class="ns-empty-txt">Awaiting next call…</div></div>';
    return;
  }
  var it = items[0];
  var badge = '';
  if(it.priority==='3') badge='<span class="badge b-vip">★ VIP</span>';
  else if(it.priority==='2') badge='<span class="badge b-urgent">⚡ Urgent</span>';
  else if(it.priority==='1') badge='<span class="badge b-prio">↑ Priority</span>';
  var dept = it.department ? '<span class="ns-dept">'+esc(it.department)+'</span>' : '';
  el.innerHTML =
    '<div class="ns-inner">' +
      '<div class="ns-tok-box"><div class="ns-tok">'+esc(it.token)+'</div><div class="ns-tok-lbl">Token</div></div>' +
      '<div class="ns-info">' +
        '<div class="ns-name">'+visitorName(it)+'</div>' + dept +
        '<div class="ns-waited">Waited: '+Math.round(it.wait_duration||0)+' min</div>' +
      '</div>' +
      '<div class="ns-badge-area">'+badge+'</div>' +
    '</div>';
}

/* ════════════════════════════════════════════════════════════════
   RENDER CALLED — diff-based
════════════════════════════════════════════════════════════════ */
function renderCalled(items){
  var sec  = document.getElementById('called-wrap-section');
  var list = document.getElementById('called-list');

  if(!items.length){
    if(sec.style.display !== 'none'){ sec.style.display='none'; list.innerHTML=''; calledState={}; }
    return;
  }
  sec.style.display = 'flex';

  items.forEach(function(it){
    var k   = rowKey(it);
    var eid = 'called-' + it.id;
    if(calledState[it.id] === k) return;
    calledState[it.id] = k;
    var existing = document.getElementById(eid);
    var html =
      '<div class="called-card" id="'+eid+'">' +
        '<div class="c-tok">'+esc(it.token)+'</div>' +
        '<div class="c-name">'+visitorName(it)+'</div>' +
        '<div class="c-arrow">→ Proceed to desk</div>' +
      '</div>';
    if(existing){ existing.outerHTML = html; }
    else { list.insertAdjacentHTML('beforeend', html); }
  });

  // Remove stale entries
  var currentIds = items.reduce(function(a,i){ a[i.id]=true; return a; }, {});
  Object.keys(calledState).forEach(function(id){
    if(!currentIds[id]){
      var el = document.getElementById('called-' + id);
      if(el) el.remove();
      delete calledState[id];
    }
  });
}

/* ════════════════════════════════════════════════════════════════
   RENDER WAITING LIST — diff-based, ZERO full rewrite
   Algorithm:
     1. Update existing rows in-place if data changed
     2. Append new rows with animation
     3. Remove rows that left the queue
     4. Reorder via CSS order property (no DOM move)
════════════════════════════════════════════════════════════════ */
function renderWaiting(items, total){
  var container = document.getElementById('wlist');

  if(!items.length){
    container.innerHTML = '<div class="wl-empty"><div class="wl-empty-ico">✓</div><div class="wl-empty-txt">No visitors waiting</div></div>';
    wlistState = {};
    return;
  }

  // Remove empty placeholder if present
  var empty = container.querySelector('.wl-empty');
  if(empty) empty.remove();

  var newState = {};
  var displayed = items.slice(0, MAX_ROW);

  displayed.forEach(function(it, i){
    var k   = rowKey(it) + '|pos:' + i;
    var eid = 'wrow-' + it.id;
    newState[it.id] = k;

    if(wlistState[it.id] === k) return;  // identical → skip

    var wt  = it.estimated_wait > 0 ? ('~'+it.estimated_wait+' min') : '—';
    var wtc = (it.estimated_wait>0 && it.estimated_wait<=8) ? 'soon' :
              (it.estimated_wait>=30) ? 'long' : '';
    var cls = ['wrow'];
    if(i===0) cls.push('next');
    if(it.priority==='3') cls.push('is-vip');
    if(it.priority==='2') cls.push('is-urgent');
    if(it.is_late) cls.push('is-late');

    var existing = document.getElementById(eid);
    if(existing){
      // Update in-place — no flicker, no animation
      existing.className = cls.join(' ');
      existing.style.order = i;
      // Update cells individually
      var cells = existing.children;
      if(cells[0]) cells[0].textContent = i+1;
      if(cells[1]) cells[1].textContent = it.token;
      if(cells[2]) cells[2].innerHTML   = visitorName(it);
      if(cells[3]) cells[3].textContent = it.department || '—';
      if(cells[4]){
        cells[4].textContent = wt;
        cells[4].className = 'wr-wait' + (wtc ? ' '+wtc : '');
      }
    } else {
      // New row — animate in
      var div = document.createElement('div');
      div.id        = eid;
      div.className = cls.join(' ') + ' wrow-new';
      div.style.order = i;
      div.innerHTML =
        '<span class="wr-pos">'+(i+1)+'</span>' +
        '<span class="wr-tok">'+esc(it.token)+'</span>' +
        '<span class="wr-name">'+visitorName(it)+'</span>' +
        '<span class="wr-dept">'+esc(it.department||'—')+'</span>' +
        '<span class="wr-wait'+( wtc?' '+wtc:'')+'">'+wt+'</span>';
      container.appendChild(div);
      // Remove animation class after it plays
      setTimeout(function(){ div.classList.remove('wrow-new'); }, 500);
    }
  });

  // Remove rows that are no longer in the list
  Object.keys(wlistState).forEach(function(id){
    if(!newState[id]){
      var el = document.getElementById('wrow-' + id);
      if(el) el.remove();
    }
  });

  // More badge
  var moreBadge = container.querySelector('.more-badge');
  if(total > MAX_ROW){
    var msg = '+ ' + (total - MAX_ROW) + ' more in queue';
    if(!moreBadge){
      var d = document.createElement('div');
      d.className = 'more-badge';
      d.textContent = msg;
      container.appendChild(d);
    } else if(moreBadge.textContent !== msg){
      moreBadge.textContent = msg;
    }
  } else {
    if(moreBadge) moreBadge.remove();
  }

  wlistState = newState;
}

/* ════════════════════════════════════════════════════════════════
   PROCESS API DATA
════════════════════════════════════════════════════════════════ */
function processData(data){
  audioOn  = data.audio_enabled  !== false;
  showName = data.show_visitor_name !== false;  // live-update from room settings

  // Header
  var rn = data.room_name || ROOM.room_name || '';
  setText('hdr-room', rn);
  setText('hdr-msg',  data.welcome_message || ROOM.welcome_message || '');

  // Ticker — only rebuild when content changes
  var newTicker = data.ticker_messages || ROOM.ticker_messages || '';
  if(newTicker !== (window._lastTicker||'')){
    window._lastTicker = newTicker;
    buildTicker(newTicker);
  }

  var cur = data.current || [];
  var cal = data.called  || [];
  var wai = data.waiting || [];

  // Detect new serving/called → overlay + audio
  var newServing = cur.filter(function(x){ return !prevServingIds[x.id]; });
  var newCalled  = cal.filter(function(x){ return !prevCalledIds[x.id]; });

  newServing.forEach(function(it){
    showOverlay(it);
    var sn = spokenName(it);
    speak('Attention. Token '+it.token.split('').join(' ')+'.' +
          (sn ? ' '+sn+'.' : '') +
          ' Please proceed to the service desk.');
  });
  if(!newServing.length && newCalled.length && !ovActive){
    showOverlay(newCalled[0]);
    var sn0 = spokenName(newCalled[0]);
    speak('Token '+newCalled[0].token.split('').join(' ')+'.' +
          (sn0 ? ' '+sn0+'.' : '') +
          ' Please come to the desk.');
  }

  // Update state maps
  prevServingIds = {};
  cur.forEach(function(x){ prevServingIds[x.id] = true; });
  prevCalledIds = {};
  cal.forEach(function(x){ prevCalledIds[x.id] = true; });

  // Render (diff-based — no flicker)
  renderServing(cur);
  renderCalled(cal);
  renderWaiting(wai, data.total_waiting || 0);

  // KPIs
  setText('kpi-w',    String(data.total_waiting || 0));
  setText('kpi-s',    String(data.done_today    || 0));
  setText('st-total', String((data.total_waiting||0) + cur.length + cal.length));
  setText('st-avg',   String(Math.round(data.avg_wait || 0)));
}

/* ════════════════════════════════════════════════════════════════
   POLL
════════════════════════════════════════════════════════════════ */
function poll(){
  if(!API_TOKEN) return;
  fetch('/waiting-room/api/queue/' + API_TOKEN, {
    method:'GET', headers:{'Accept':'application/json'},
    cache:'no-store'
  })
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d && !d.error) processData(d); })
  .catch(function(e){ console.warn('WR poll:', e); });
}

poll();
setInterval(poll, POLL);

})();
</script>
</body>
</html>
