ar: { dir:'rtl', header:{title:'غرفة الانتظار الذكية', sub:'دليل المستخدم'},
  hero:{title:'دليل المستخدم', desc:'كل ما تحتاجه لإدارة غرفة انتظارك بكفاءة. يغطي هذا الدليل جميع العمليات اليومية من إضافة زائر إلى قراءة إحصائياتك.', chips:['📋 إدارة الطابور','📺 شاشة العرض','🖥 كشك التسجيل الذاتي','📊 السجل','⚙ الإعدادات']},
  toc:[{title:'نظرة عامة',id:'overview'},{title:'لوحة الطابور',id:'queue'},{title:'إضافة زائر',id:'add-visitor'},{title:'استدعاء الزوار',id:'calling'},{title:'تدفق الحالات',id:'status-flow'},{title:'مستويات الأولوية',id:'priority'},{title:'شاشة التلفاز',id:'display'},{title:'كشك التسجيل',id:'kiosk'},{title:'سجل الزيارات',id:'history'},{title:'التقرير اليومي',id:'report'},{title:'الإعدادات',id:'settings'},{title:'نصائح عملية',id:'tips'}],
  sections:[
    {id:'overview',num:1,title:'نظرة عامة',content:`<p style="color:var(--sub);margin-bottom:20px">غرفة الانتظار الذكية هي حل متكامل لإدارة الطوابير. تتيح للموظفين إدارة الزوار في الوقت الفعلي، وعرض الطابور على شاشة التلفاز للمرضى، كما تمكّن الزوار من التسجيل بأنفسهم عبر كشك اللمس.</p><div class="card-grid"><div class="card"><div class="card-icon">📋</div><div class="card-title">لوحة الطابور</div><div class="card-text">لوحة تحكم الموظفين لإضافة واستدعاء وإدارة كل زائر في الوقت الفعلي.</div></div><div class="card green"><div class="card-icon">📺</div><div class="card-title">شاشة التلفاز</div><div class="card-text">شاشة عامة تعرض "يُخدم الآن" وقائمة الانتظار، تتحدث كل 5 ثوان.</div></div><div class="card amber"><div class="card-icon">🖥</div><div class="card-title">كشك التسجيل</div><div class="card-text">لوحة لمس يسجّل فيها الزوار أنفسهم ويحصلون على رقم تذكرتهم.</div></div><div class="card purple"><div class="card-icon">📊</div><div class="card-title">السجل والتقارير</div><div class="card-text">سجل كامل بجميع الزيارات مع أوقات الانتظار والتقارير القابلة للطباعة.</div></div></div>`},
    {id:'queue',num:2,title:'لوحة الطابور',content:`<p style="color:var(--sub)">انتقل إلى <strong>الطابور المباشر ← لوحة الطابور</strong>. هذه شاشة العمل الرئيسية. يتم عرض الزوار كبطاقات مجمّعة حسب الحالة: <em>في الانتظار</em>، <em>تم الاستدعاء</em>، و<em>في الخدمة</em>.</p>`},
    {id:'add-visitor',num:3,title:'إضافة زائر',content:`<h3 class="sub-title">الطريقة 1 — الاستقبال يضيف الزائر يدوياً</h3><div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">فتح لوحة الطابور</div><div class="step-text">الانتقال إلى <strong>الطابور المباشر ← لوحة الطابور</strong>.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">النقر على "جديد"</div><div class="step-text">يظهر نموذج سريع في أعلى القائمة.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-track"></div><div class="step-body"><div class="step-title">ملء بيانات الزائر</div><div class="step-text">أدخل الاسم (إلزامي)، وحدد الغرفة والقسم والأولوية إذا لزم الأمر.</div></div></div><div class="step"><div class="step-dot">4</div><div class="step-body"><div class="step-title">الحفظ</div><div class="step-text">يُضاف الزائر فوراً إلى الطابور برقم تذكرة. تتحدث شاشة التلفاز خلال 5 ثوان.</div></div></div></div>`},
    {id:'calling',num:4,title:'استدعاء الزوار',content:`<div class="action-grid"><div class="action-card"><div class="action-icon">📢</div><div class="action-body"><div class="action-name">استدعاء</div><div class="action-desc">يعلن عن الزائر. تظهر تذكرته في "يرجى التوجه" على التلفاز مع حركة متحركة وإعلان صوتي.</div></div></div><div class="action-card"><div class="action-icon">🔁</div><div class="action-body"><div class="action-name">إعادة الاستدعاء</div><div class="action-desc">يُرسل إعلاناً ثانياً إذا لم يستجب الزائر.</div></div></div><div class="action-card"><div class="action-icon">▶</div><div class="action-body"><div class="action-name">بدء الخدمة</div><div class="action-desc">يؤكد وصول الزائر إلى المكتب. تذكرته تنتقل إلى "يُخدم الآن".</div></div></div><div class="action-card"><div class="action-icon">✔</div><div class="action-body"><div class="action-name">مكتمل</div><div class="action-desc">يُعلّم الزيارة كمكتملة ويحفظها في السجل.</div></div></div><div class="action-card"><div class="action-icon">✗</div><div class="action-body"><div class="action-name">غائب</div><div class="action-desc">تم الاستدعاء لكنه لم يستجب.</div></div></div><div class="action-card"><div class="action-icon">↩</div><div class="action-body"><div class="action-name">إعادة للطابور</div><div class="action-desc">إذا عاد الغائب، يُعاد إدراجه في الطابور.</div></div></div></div>`},
    {id:'status-flow',num:5,title:'تدفق الحالات',content:`<table class="status-table"><tr><th>الحالة</th><th>المعنى</th><th>يظهر على التلفاز؟</th><th>الإجراء التالي</th></tr><tr><td><span class="badge badge-waiting">في الانتظار</span></td><td>الزائر جالس ينتظر</td><td>نعم — في قائمة الانتظار</td><td>استدعاء</td></tr><tr><td><span class="badge badge-called">تم استدعاؤه</span></td><td>أُعلن عنه، يتجه للمكتب</td><td>نعم — "يرجى التوجه"</td><td>بدء الخدمة أو غائب</td></tr><tr><td><span class="badge badge-service">في الخدمة</span></td><td>الزيارة جارية</td><td>نعم — "يُخدم الآن"</td><td>مكتمل</td></tr><tr><td><span class="badge badge-done">مكتمل</span></td><td>الزيارة اكتملت</td><td>لا</td><td>— (في السجل)</td></tr><tr><td><span class="badge badge-noshow">غائب</span></td><td>استُدعي ولم يستجب</td><td>لا</td><td>إعادة للطابور</td></tr></table>`},
    {id:'priority',num:6,title:'مستويات الأولوية',content:`<div class="prio-grid"><div class="prio-card" style="border-left:3px solid var(--dim)"><div class="prio-label">عادي</div><div class="prio-desc">الإعداد الافتراضي. يُخدمون بترتيب الوصول.</div></div><div class="prio-card" style="border-left:3px solid var(--amber)"><div class="prio-label" style="color:var(--amber)">↑ أولوية</div><div class="prio-desc">يُخدمون قبل العاديين. للمسنين أو أصحاب المواعيد.</div></div><div class="prio-card" style="border-left:3px solid var(--red)"><div class="prio-label" style="color:var(--red)">⚡ عاجل</div><div class="prio-desc">يُخدمون قبل ذوي الأولوية. للحالات الطارئة.</div></div><div class="prio-card" style="border-left:3px solid var(--purple)"><div class="prio-label" style="color:var(--purple)">★ كبار الشخصيات</div><div class="prio-desc">أعلى أولوية. يُخدم فوراً بعد المريض الحالي.</div></div></div>`},
    {id:'display',num:7,title:'شاشة التلفاز',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">الانتقال إلى إعدادات الغرفة</div><div class="step-text">الانتقال إلى <strong>الغرف ← غرف الانتظار</strong> وفتح غرفتك.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">نسخ رابط العرض</div><div class="step-text">النقر على زر <strong>📺 TV Display</strong> أو نسخ الرابط من حقل "رابط العرض".</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">فتحه على شاشتك</div><div class="step-text">لصق الرابط في متصفح الشاشة. تفعيل وضع ملء الشاشة (F11) للحصول على أفضل نتيجة.</div></div></div></div><div class="tip success"><div class="tip-icon">🔊</div><div class="tip-text">يتم الإعلان الصوتي تلقائياً عبر تحويل النص إلى كلام في المتصفح. تأكد من تفعيل الصوت على متصفح شاشة التلفاز.</div></div>`},
    {id:'kiosk',num:8,title:'كشك التسجيل الذاتي',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">الحصول على رابط الكشك</div><div class="step-text">فتح الغرفة والنقر على <strong>🖥 Kiosk</strong>.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">فتحه على لوحة اللمس</div><div class="step-text">لصق الرابط في متصفح اللوحة وتفعيل وضع ملء الشاشة.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">تثبيته عند المدخل</div><div class="step-text">ضع اللوحة في مكان يسهل على الزوار القادمين رؤيتها واستخدامها.</div></div></div></div>`},
    {id:'history',num:9,title:'سجل الزيارات',content:`<p style="color:var(--sub)">انتقل إلى <strong>الطابور المباشر ← سجل الزيارات</strong> لعرض جميع الزيارات السابقة: المكتملة، الغائبة، والملغاة. استخدم شريط البحث للتصفية حسب التاريخ أو الغرفة أو القسم أو الاسم.</p>`},
    {id:'report',num:10,title:'التقرير اليومي',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">فتح غرفة الانتظار</div><div class="step-text">الانتقال إلى <strong>الغرف ← غرف الانتظار</strong> والنقر على الغرفة المطلوبة.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">النقر على طباعة ← التقرير اليومي</div><div class="step-text">في القائمة العلوية، انقر على أيقونة الطابعة وحدد <strong>التقرير اليومي للطابور</strong>.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">حفظ أو طباعة</div><div class="step-text">يُفتح ملف PDF في علامة تبويب جديدة. استخدم مربع حوار الطباعة للطباعة أو الحفظ.</div></div></div></div>`},
    {id:'settings',num:11,title:'الإعدادات',content:`<table class="settings-table"><tr><th>الإعداد</th><th>الافتراضي</th><th>الوصف</th></tr><tr><td>الإعلانات الصوتية</td><td>مفعّل</td><td>إعلانات صوتية تلقائية عند استدعاء كل زائر.</td></tr><tr><td>عرض وقت الانتظار المتوقع</td><td>مفعّل</td><td>يعرض الدقائق المتوقعة على التلفاز والكشك.</td></tr><tr><td>الغياب التلقائي بعد</td><td>10 دقائق</td><td>إذا لم يستجب الزائر المستدعى خلال هذه المدة، يُعلَّم تلقائياً كغائب.</td></tr><tr><td>عتبة التأخر</td><td>45 دقيقة</td><td>يُسلَّط الضوء بالأحمر على الزوار الذين انتظروا أطول من هذه المدة.</td></tr></table>`},
    {id:'tips',num:12,title:'نصائح عملية',content:`<div class="tip success"><div class="tip-icon">✅</div><div class="tip-text"><strong>نصيحة للشاشة:</strong> افتح دائماً شاشة العرض في وضع ملء الشاشة (F11) على شاشة مخصصة.</div></div><div class="tip success"><div class="tip-icon">✅</div><div class="tip-text"><strong>نصيحة للصوت:</strong> اختبر الإعلان الصوتي قبل فتح العيادة. انقر "استدعاء" على أي زائر وتحقق من تشغيل الصوت على شاشة التلفاز.</div></div><div class="tip warn"><div class="tip-icon">⚠</div><div class="tip-text"><strong>الروابط عامة:</strong> شاشة التلفاز والكشك لا تحتاجان إلى تسجيل دخول. لا تشاركهما علناً. استخدمهما فقط على أجهزة مخصصة داخل العيادة.</div></div>`},
  ]
},

es:{dir:'ltr',header:{title:'Sala de Espera Inteligente',sub:'Manual de Usuario'},
  hero:{title:'Manual de Usuario',desc:'Todo lo que necesita para gestionar su sala de espera de manera eficiente. Esta guía cubre todas las operaciones diarias, desde añadir un visitante hasta leer sus estadísticas.',chips:['📋 Gestión de cola','📺 Pantalla TV','🖥 Kiosko de check-in','📊 Historial','⚙ Configuración']},
  toc:[{title:'Descripción general',id:'overview'},{title:'Tablero de cola',id:'queue'},{title:'Añadir visitante',id:'add-visitor'},{title:'Llamar visitantes',id:'calling'},{title:'Flujo de estados',id:'status-flow'},{title:'Niveles de prioridad',id:'priority'},{title:'Pantalla TV',id:'display'},{title:'Kiosko',id:'kiosk'},{title:'Historial',id:'history'},{title:'Informe diario',id:'report'},{title:'Configuración',id:'settings'},{title:'Consejos',id:'tips'}],
  sections:[
    {id:'overview',num:1,title:'Descripción general',content:`<p style="color:var(--sub);margin-bottom:20px">Smart Waiting Room es una solución completa de gestión de colas. Permite a su personal gestionar visitantes en tiempo real, mostrar la cola en una pantalla de TV y a los visitantes registrarse solos mediante un kiosco táctil.</p><div class="card-grid"><div class="card"><div class="card-icon">📋</div><div class="card-title">Tablero de cola</div><div class="card-text">El panel de control del personal para añadir, llamar y gestionar a cada visitante en tiempo real.</div></div><div class="card green"><div class="card-icon">📺</div><div class="card-title">Pantalla TV</div><div class="card-text">Pantalla pública que muestra "Atendiendo ahora" y la lista de espera, actualizada cada 5 segundos.</div></div><div class="card amber"><div class="card-icon">🖥</div><div class="card-title">Kiosco de auto-registro</div><div class="card-text">Tablet donde los visitantes se registran y reciben su número de turno.</div></div><div class="card purple"><div class="card-icon">📊</div><div class="card-title">Historial e informes</div><div class="card-text">Historial completo de todas las visitas con tiempos de espera e informe diario imprimible.</div></div></div>`},
    {id:'queue',num:2,title:'Tablero de cola',content:`<p style="color:var(--sub)">Navegue a <strong>Cola en vivo → Tablero de cola</strong>. Esta es su pantalla de trabajo principal. Los visitantes se muestran como tarjetas agrupadas por estado: <em>En espera</em>, <em>Llamado</em>, y <em>En servicio</em>.</p>`},
    {id:'add-visitor',num:3,title:'Añadir visitante',content:`<h3 class="sub-title">Método 1 — Recepción añade manualmente</h3><div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Abrir el tablero de cola</div><div class="step-text">Ir a <strong>Cola en vivo → Tablero de cola</strong>.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">Hacer clic en "Nuevo"</div><div class="step-text">Aparece un formulario rápido en la parte superior de la lista.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-track"></div><div class="step-body"><div class="step-title">Completar los datos</div><div class="step-text">Ingrese el nombre (obligatorio), seleccione la sala, departamento y prioridad si es necesario.</div></div></div><div class="step"><div class="step-dot">4</div><div class="step-body"><div class="step-title">Guardar</div><div class="step-text">El visitante se agrega a la cola con un número de turno. La pantalla TV se actualiza en 5 segundos.</div></div></div></div>`},
    {id:'calling',num:4,title:'Llamar visitantes',content:`<div class="action-grid"><div class="action-card"><div class="action-icon">📢</div><div class="action-body"><div class="action-name">Llamar</div><div class="action-desc">Anuncia al visitante. Su turno aparece en "Por favor proceda" en la TV con animación y anuncio de voz.</div></div></div><div class="action-card"><div class="action-icon">▶</div><div class="action-body"><div class="action-name">Iniciar servicio</div><div class="action-desc">Confirma que el visitante está en el mostrador. Pasa a "Atendiendo ahora".</div></div></div><div class="action-card"><div class="action-icon">✔</div><div class="action-body"><div class="action-name">Completado</div><div class="action-desc">Marca la visita como completa y la guarda en el historial.</div></div></div><div class="action-card"><div class="action-icon">✗</div><div class="action-body"><div class="action-name">No se presentó</div><div class="action-desc">Fue llamado pero no respondió.</div></div></div></div>`},
    {id:'status-flow',num:5,title:'Flujo de estados',content:`<table class="status-table"><tr><th>Estado</th><th>Significado</th><th>¿En TV?</th><th>Siguiente acción</th></tr><tr><td><span class="badge badge-waiting">En espera</span></td><td>Sentado, esperando ser llamado</td><td>Sí — lista de espera</td><td>Llamar</td></tr><tr><td><span class="badge badge-called">Llamado</span></td><td>Anunciado, caminando al mostrador</td><td>Sí — "Por favor proceda"</td><td>Iniciar servicio</td></tr><tr><td><span class="badge badge-service">En servicio</span></td><td>Visita en curso</td><td>Sí — "Atendiendo ahora"</td><td>Completado</td></tr><tr><td><span class="badge badge-done">Completado</span></td><td>Visita completa</td><td>No</td><td>—</td></tr><tr><td><span class="badge badge-noshow">No se presentó</span></td><td>Llamado sin respuesta</td><td>No</td><td>Re-encolar</td></tr></table>`},
    {id:'priority',num:6,title:'Niveles de prioridad',content:`<div class="prio-grid"><div class="prio-card" style="border-left:3px solid var(--dim)"><div class="prio-label">Normal</div><div class="prio-desc">Predeterminado. Atendidos en orden de llegada.</div></div><div class="prio-card" style="border-left:3px solid var(--amber)"><div class="prio-label" style="color:var(--amber)">↑ Prioritario</div><div class="prio-desc">Atendidos antes que los normales. Para ancianos o con cita.</div></div><div class="prio-card" style="border-left:3px solid var(--red)"><div class="prio-label" style="color:var(--red)">⚡ Urgente</div><div class="prio-desc">Atendidos antes que los prioritarios. Para emergencias.</div></div><div class="prio-card" style="border-left:3px solid var(--purple)"><div class="prio-label" style="color:var(--purple)">★ VIP</div><div class="prio-desc">Máxima prioridad. Atendido inmediatamente después del paciente actual.</div></div></div>`},
    {id:'display',num:7,title:'Pantalla TV',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Abrir configuración de la sala</div><div class="step-text">Navegar a <strong>Salas → Salas de espera</strong> y abrir su sala.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">Copiar la URL de visualización</div><div class="step-text">Hacer clic en el botón <strong>📺 TV Display</strong> o copiar la URL del campo "URL de visualización".</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">Abrir en su pantalla</div><div class="step-text">Pegar la URL en el navegador de la pantalla y activar pantalla completa (F11).</div></div></div></div><div class="tip success"><div class="tip-icon">🔊</div><div class="tip-text">Los anuncios de voz son automáticos. Asegúrese de que el sonido esté activado en el navegador de la pantalla TV.</div></div>`},
    {id:'kiosk',num:8,title:'Kiosco de auto-registro',content:`<p style="color:var(--sub)">Obtenga la URL del kiosco desde su sala, ábrala en una tablet táctil en la entrada y los visitantes podrán registrarse solos en 4 pasos simples: tocar "Registrarse" → seleccionar servicio → ingresar nombre → recibir turno.</p>`},
    {id:'history',num:9,title:'Historial de visitas',content:`<p style="color:var(--sub)">Navegue a <strong>Cola en vivo → Historial de visitas</strong>. Use la barra de búsqueda para filtrar por fecha, sala, departamento, nombre o estado.</p>`},
    {id:'report',num:10,title:'Informe diario',content:`<p style="color:var(--sub)">Abra su sala de espera, haga clic en <strong>Imprimir → Informe diario de cola</strong>. El PDF incluye visitantes atendidos, tiempo promedio de espera, tasa de ausencias y tabla completa del día.</p>`},
    {id:'settings',num:11,title:'Configuración',content:`<table class="settings-table"><tr><th>Configuración</th><th>Predeterminado</th><th>Descripción</th></tr><tr><td>Anuncios de audio</td><td>Activado</td><td>Anuncios de voz automáticos al llamar a cada visitante.</td></tr><tr><td>Mostrar tiempo estimado</td><td>Activado</td><td>Muestra los minutos de espera estimados en TV y kiosco.</td></tr><tr><td>Ausente automático tras</td><td>10 min</td><td>Si un visitante "Llamado" no responde en este tiempo, se marca como ausente automáticamente.</td></tr><tr><td>Umbral de retraso</td><td>45 min</td><td>Los visitantes que esperan más de este tiempo se resaltan en rojo.</td></tr></table>`},
    {id:'tips',num:12,title:'Consejos prácticos',content:`<div class="tip success"><div class="tip-icon">✅</div><div class="tip-text"><strong>TV:</strong> Siempre abra la pantalla en modo pantalla completa (F11) en una pantalla dedicada.</div></div><div class="tip success"><div class="tip-icon">✅</div><div class="tip-text"><strong>Audio:</strong> Pruebe el anuncio antes de abrir la clínica. Haga clic en "Llamar" en cualquier visitante y verifique que el sonido se reproduzca en la TV.</div></div><div class="tip warn"><div class="tip-icon">⚠</div><div class="tip-text"><strong>URLs públicas:</strong> No las comparta públicamente. Úselas solo en dispositivos dedicados dentro de la clínica.</div></div>`},
  ]
},

de:{dir:'ltr',header:{title:'Intelligentes Wartezimmer',sub:'Benutzerhandbuch'},
  hero:{title:'Benutzerhandbuch',desc:'Alles was Sie zur effizienten Verwaltung Ihres Wartezimmers benötigen. Dieser Leitfaden deckt alle täglichen Abläufe ab.',chips:['📋 Warteschlange','📺 TV-Anzeige','🖥 Kiosk','📊 Verlauf','⚙ Einstellungen']},
  toc:[{title:'Übersicht',id:'overview'},{title:'Warteschlangen-Board',id:'queue'},{title:'Besucher hinzufügen',id:'add-visitor'},{title:'Besucher aufrufen',id:'calling'},{title:'Status-Ablauf',id:'status-flow'},{title:'Prioritätsstufen',id:'priority'},{title:'TV-Anzeige',id:'display'},{title:'Kiosk',id:'kiosk'},{title:'Besuchsverlauf',id:'history'},{title:'Tagesbericht',id:'report'},{title:'Einstellungen',id:'settings'},{title:'Tipps',id:'tips'}],
  sections:[
    {id:'overview',num:1,title:'Übersicht',content:`<p style="color:var(--sub);margin-bottom:20px">Smart Waiting Room ist eine vollständige Warteschlangenverwaltung. Sie ermöglicht Ihrem Personal, Besucher in Echtzeit zu verwalten, die Schlange auf einem TV-Bildschirm anzuzeigen und Besuchern, sich selbst per Tablet-Kiosk einzuchecken.</p><div class="card-grid"><div class="card"><div class="card-icon">📋</div><div class="card-title">Warteschlangen-Board</div><div class="card-text">Das Personal-Dashboard zum Hinzufügen, Aufrufen und Verwalten jedes Besuchers in Echtzeit.</div></div><div class="card green"><div class="card-icon">📺</div><div class="card-title">TV-Anzeige</div><div class="card-text">Öffentlicher Bildschirm mit "Wird jetzt bedient" und der Warteliste, alle 5 Sekunden aktualisiert.</div></div><div class="card amber"><div class="card-icon">🖥</div><div class="card-title">Selbst-Check-in-Kiosk</div><div class="card-text">Tablet, an dem sich Besucher selbst anmelden und ihre Wartenummer erhalten.</div></div></div>`},
    {id:'queue',num:2,title:'Warteschlangen-Board',content:`<p style="color:var(--sub)">Navigieren Sie zu <strong>Live-Warteschlange → Warteschlangen-Board</strong>. Dies ist Ihr Hauptarbeitsbildschirm. Besucher werden als Karten angezeigt, gruppiert nach Status: <em>Wartend</em>, <em>Aufgerufen</em> und <em>In Bearbeitung</em>.</p>`},
    {id:'add-visitor',num:3,title:'Besucher hinzufügen',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Board öffnen</div><div class="step-text">Navigieren Sie zu <strong>Live-Warteschlange → Board</strong>.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">"Neu" klicken</div><div class="step-text">Ein Schnellformular erscheint oben in der Liste.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-track"></div><div class="step-body"><div class="step-title">Daten eingeben</div><div class="step-text">Name (Pflicht), Raum, Abteilung und Priorität eingeben.</div></div></div><div class="step"><div class="step-dot">4</div><div class="step-body"><div class="step-title">Speichern</div><div class="step-text">Besucher wird sofort mit Wartenummer in die Schlange eingetragen.</div></div></div></div>`},
    {id:'calling',num:4,title:'Besucher aufrufen',content:`<div class="action-grid"><div class="action-card"><div class="action-icon">📢</div><div class="action-body"><div class="action-name">Aufrufen</div><div class="action-desc">Kündigt den Besucher an. Seine Nummer erscheint mit Animation und Durchsage auf der TV-Anzeige.</div></div></div><div class="action-card"><div class="action-icon">▶</div><div class="action-body"><div class="action-name">Service starten</div><div class="action-desc">Bestätigt, dass der Besucher am Schalter ist.</div></div></div><div class="action-card"><div class="action-icon">✔</div><div class="action-body"><div class="action-name">Erledigt</div><div class="action-desc">Markiert den Besuch als abgeschlossen.</div></div></div><div class="action-card"><div class="action-icon">✗</div><div class="action-body"><div class="action-name">Nicht erschienen</div><div class="action-desc">Aufgerufen, aber nicht reagiert.</div></div></div></div>`},
    {id:'status-flow',num:5,title:'Status-Ablauf',content:`<table class="status-table"><tr><th>Status</th><th>Bedeutung</th><th>Auf TV?</th><th>Nächste Aktion</th></tr><tr><td><span class="badge badge-waiting">Wartend</span></td><td>Sitzt, wartet auf Aufruf</td><td>Ja — Warteliste</td><td>Aufrufen</td></tr><tr><td><span class="badge badge-called">Aufgerufen</span></td><td>Angekündigt, läuft zum Schalter</td><td>Ja — "Bitte vortreten"</td><td>Service starten</td></tr><tr><td><span class="badge badge-service">In Bearbeitung</span></td><td>Besuch läuft</td><td>Ja — "Wird bedient"</td><td>Erledigt</td></tr><tr><td><span class="badge badge-done">Erledigt</span></td><td>Besuch abgeschlossen</td><td>Nein</td><td>—</td></tr><tr><td><span class="badge badge-noshow">Nicht erschienen</span></td><td>Aufgerufen, keine Reaktion</td><td>Nein</td><td>Erneut einreihen</td></tr></table>`},
    {id:'priority',num:6,title:'Prioritätsstufen',content:`<div class="prio-grid"><div class="prio-card" style="border-left:3px solid var(--dim)"><div class="prio-label">Normal</div><div class="prio-desc">Standard. Werden in Ankunftsreihenfolge bedient.</div></div><div class="prio-card" style="border-left:3px solid var(--amber)"><div class="prio-label" style="color:var(--amber)">↑ Priorität</div><div class="prio-desc">Vor normalen Besuchern. Für Senioren oder Terminpatienten.</div></div><div class="prio-card" style="border-left:3px solid var(--red)"><div class="prio-label" style="color:var(--red)">⚡ Dringend</div><div class="prio-desc">Vor Priorität-Besuchern. Für Notfälle.</div></div><div class="prio-card" style="border-left:3px solid var(--purple)"><div class="prio-label" style="color:var(--purple)">★ VIP</div><div class="prio-desc">Höchste Priorität. Sofort nach dem aktuellen Patienten bedient.</div></div></div>`},
    {id:'display',num:7,title:'TV-Anzeige',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Warteraum-Einstellungen öffnen</div><div class="step-text">Navigieren zu <strong>Räume → Wartezimmer</strong> und Raum öffnen.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">Anzeige-URL kopieren</div><div class="step-text">Klick auf <strong>📺 TV Display</strong> oder URL aus dem Feld "Anzeige-URL" kopieren.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">Im Browser öffnen</div><div class="step-text">URL im Browser des Bildschirms einfügen. Vollbild (F11) aktivieren.</div></div></div></div>`},
    {id:'kiosk',num:8,title:'Kiosk',content:`<p style="color:var(--sub)">Öffnen Sie Ihren Raum, klicken Sie auf <strong>🖥 Kiosk</strong>, öffnen Sie die URL auf einem Tablet am Eingang. Besucher können sich in 4 einfachen Schritten selbst anmelden.</p>`},
    {id:'history',num:9,title:'Besuchsverlauf',content:`<p style="color:var(--sub)">Navigieren Sie zu <strong>Live-Warteschlange → Besuchsverlauf</strong>. Alle abgeschlossenen, nicht erschienenen und abgesagten Besuche werden hier angezeigt.</p>`},
    {id:'report',num:10,title:'Tagesbericht',content:`<p style="color:var(--sub)">Öffnen Sie Ihren Warteraum, klicken Sie auf <strong>Drucken → Tagesbericht</strong>. Das PDF öffnet sich in einem neuen Tab.</p>`},
    {id:'settings',num:11,title:'Einstellungen',content:`<table class="settings-table"><tr><th>Einstellung</th><th>Standard</th><th>Beschreibung</th></tr><tr><td>Audiodurchsagen</td><td>Ein</td><td>Automatische Sprachdurchsagen beim Aufrufen jedes Besuchers.</td></tr><tr><td>Wartezeit anzeigen</td><td>Ein</td><td>Zeigt geschätzte Wartezeit auf TV und Kiosk.</td></tr><tr><td>Auto-Nicht-erschienen nach</td><td>10 min</td><td>Wird ein aufgerufener Besucher nicht within dieser Zeit, wird er automatisch als nicht erschienen markiert.</td></tr><tr><td>Verzögerungsschwelle</td><td>45 min</td><td>Besucher, die länger als diese Zeit warten, werden rot hervorgehoben.</td></tr></table>`},
    {id:'tips',num:12,title:'Tipps',content:`<div class="tip success"><div class="tip-icon">✅</div><div class="tip-text">Öffnen Sie den TV-Bildschirm immer im Vollbildmodus (F11) auf einem dedizierten Bildschirm.</div></div><div class="tip success"><div class="tip-icon">✅</div><div class="tip-text">Testen Sie die Audiodurchsage, bevor Sie die Praxis öffnen.</div></div>`},
  ]
},

pt:{dir:'ltr',header:{title:'Sala de Espera Inteligente',sub:'Manual do Usuário'},
  hero:{title:'Manual do Usuário',desc:'Tudo o que você precisa para gerenciar sua sala de espera de forma eficiente. Este guia cobre todas as operações diárias.',chips:['📋 Gestão de filas','📺 Tela TV','🖥 Quiosque','📊 Histórico','⚙ Configurações']},
  toc:[{title:'Visão geral',id:'overview'},{title:'Painel de fila',id:'queue'},{title:'Adicionar visitante',id:'add-visitor'},{title:'Chamar visitantes',id:'calling'},{title:'Fluxo de status',id:'status-flow'},{title:'Níveis de prioridade',id:'priority'},{title:'Tela TV',id:'display'},{title:'Quiosque',id:'kiosk'},{title:'Histórico',id:'history'},{title:'Relatório diário',id:'report'},{title:'Configurações',id:'settings'},{title:'Dicas',id:'tips'}],
  sections:[
    {id:'overview',num:1,title:'Visão geral',content:`<p style="color:var(--sub);margin-bottom:20px">Smart Waiting Room é uma solução completa de gestão de filas. Permite à sua equipe gerenciar visitantes em tempo real, exibir a fila em uma TV e aos visitantes fazer o check-in sozinhos via quiosque.</p><div class="card-grid"><div class="card"><div class="card-icon">📋</div><div class="card-title">Painel de fila</div><div class="card-text">O painel de controle da equipe para adicionar, chamar e gerenciar cada visitante em tempo real.</div></div><div class="card green"><div class="card-icon">📺</div><div class="card-title">Tela TV</div><div class="card-text">Tela pública mostrando "Sendo atendido" e a lista de espera, atualizada a cada 5 segundos.</div></div><div class="card amber"><div class="card-icon">🖥</div><div class="card-title">Quiosque de auto check-in</div><div class="card-text">Tablet onde visitantes se registram e recebem seu número de senha.</div></div></div>`},
    {id:'queue',num:2,title:'Painel de fila',content:`<p style="color:var(--sub)">Navegue para <strong>Fila ao vivo → Painel de fila</strong>. Esta é sua tela de trabalho principal. Visitantes são exibidos como cartões agrupados por status.</p>`},
    {id:'add-visitor',num:3,title:'Adicionar visitante',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Abrir o painel de fila</div><div class="step-text">Ir para <strong>Fila ao vivo → Painel de fila</strong>.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">Clicar em "Novo"</div><div class="step-text">Um formulário rápido aparece no topo da lista.</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-track"></div><div class="step-body"><div class="step-title">Preencher os dados</div><div class="step-text">Digite o nome (obrigatório), selecione a sala, departamento e prioridade.</div></div></div><div class="step"><div class="step-dot">4</div><div class="step-body"><div class="step-title">Salvar</div><div class="step-text">O visitante é adicionado imediatamente à fila com número de senha. A TV atualiza em 5 segundos.</div></div></div></div>`},
    {id:'calling',num:4,title:'Chamar visitantes',content:`<div class="action-grid"><div class="action-card"><div class="action-icon">📢</div><div class="action-body"><div class="action-name">Chamar</div><div class="action-desc">Anuncia o visitante na TV com animação e aviso sonoro.</div></div></div><div class="action-card"><div class="action-icon">▶</div><div class="action-body"><div class="action-name">Iniciar atendimento</div><div class="action-desc">Confirma que o visitante está no balcão.</div></div></div><div class="action-card"><div class="action-icon">✔</div><div class="action-body"><div class="action-name">Concluído</div><div class="action-desc">Marca a visita como completa e arquiva no histórico.</div></div></div><div class="action-card"><div class="action-icon">✗</div><div class="action-body"><div class="action-name">Não compareceu</div><div class="action-desc">Foi chamado mas não respondeu.</div></div></div></div>`},
    {id:'status-flow',num:5,title:'Fluxo de status',content:`<table class="status-table"><tr><th>Status</th><th>Significado</th><th>Na TV?</th><th>Próxima ação</th></tr><tr><td><span class="badge badge-waiting">Aguardando</span></td><td>Sentado, esperando ser chamado</td><td>Sim — lista de espera</td><td>Chamar</td></tr><tr><td><span class="badge badge-called">Chamado</span></td><td>Anunciado, indo ao balcão</td><td>Sim — "Por favor avance"</td><td>Iniciar atendimento</td></tr><tr><td><span class="badge badge-service">Em atendimento</span></td><td>Visita em andamento</td><td>Sim — "Sendo atendido"</td><td>Concluído</td></tr><tr><td><span class="badge badge-done">Concluído</span></td><td>Visita completa</td><td>Não</td><td>—</td></tr><tr><td><span class="badge badge-noshow">Não compareceu</span></td><td>Chamado sem resposta</td><td>Não</td><td>Re-enfileirar</td></tr></table>`},
    {id:'priority',num:6,title:'Níveis de prioridade',content:`<div class="prio-grid"><div class="prio-card" style="border-left:3px solid var(--dim)"><div class="prio-label">Normal</div><div class="prio-desc">Padrão. Atendidos por ordem de chegada.</div></div><div class="prio-card" style="border-left:3px solid var(--amber)"><div class="prio-label" style="color:var(--amber)">↑ Prioritário</div><div class="prio-desc">Atendidos antes dos normais. Para idosos ou com agendamento.</div></div><div class="prio-card" style="border-left:3px solid var(--red)"><div class="prio-label" style="color:var(--red)">⚡ Urgente</div><div class="prio-desc">Atendidos antes dos prioritários. Para emergências.</div></div><div class="prio-card" style="border-left:3px solid var(--purple)"><div class="prio-label" style="color:var(--purple)">★ VIP</div><div class="prio-desc">Prioridade máxima. Atendido imediatamente após o paciente atual.</div></div></div>`},
    {id:'display',num:7,title:'Tela TV',content:`<div class="steps"><div class="step"><div class="step-dot">1</div><div class="step-track"></div><div class="step-body"><div class="step-title">Abrir configurações da sala</div><div class="step-text">Navegar para <strong>Salas → Salas de espera</strong> e abrir sua sala.</div></div></div><div class="step"><div class="step-dot">2</div><div class="step-track"></div><div class="step-body"><div class="step-title">Copiar a URL de exibição</div><div class="step-text">Clicar no botão <strong>📺 TV Display</strong> ou copiar a URL do campo "URL de exibição".</div></div></div><div class="step"><div class="step-dot">3</div><div class="step-body"><div class="step-title">Abrir no navegador</div><div class="step-text">Colar a URL no navegador da tela. Ativar tela cheia (F11).</div></div></div></div>`},

// ═══════════════════════════════════════════════════════════════════
// LANGUAGE DETECTION
// Priority: 1) Odoo user language (injected by server)
//           2) URL param ?lang=xx  (for testing)
//           3) browser navigator.language (last resort fallback)
// ═══════════════════════════════════════════════════════════════════

// Placeholder replaced by the controller with the actual Odoo user lang
var ODOO_LANG = null;

function detectLang(){
  var map = {
    en:'en', fr:'fr', ar:'ar', es:'es',
    de:'de', pt:'pt', zh:'zh',
    'zh-cn':'zh','zh-tw':'zh','zh-hk':'zh'
  };

  // 1 — Odoo server-injected lang (most reliable)
  if(ODOO_LANG && LANGS[ODOO_LANG]) return ODOO_LANG;

  // 2 — URL override: ?lang=fr  (useful for testing without Odoo)
  var urlParams = new URLSearchParams(window.location.search);
  var urlLang = (urlParams.get('lang') || '').toLowerCase();
  if(urlLang && LANGS[urlLang]) return urlLang;

  // 3 — Browser language (least reliable — reflects OS, not Odoo UI)
  var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  return map[nav.split('-')[0]] || map[nav] || 'en';
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function render(){
  var lang = detectLang();
  var L = LANGS[lang] || LANGS['en'];

  document.documentElement.lang = lang;
  document.documentElement.dir  = L.dir || 'ltr';

  // Header
  document.getElementById('mh-title').textContent = L.header.title;
  document.getElementById('mh-sub').textContent   = L.header.sub;

  // TOC
  var toc = document.getElementById('toc');
  toc.innerHTML = '<div class="toc-section-title">' + L.header.sub + '</div>' +
    L.toc.map(function(item){
      return '<a class="toc-link" href="#'+item.id+'" onclick="setActive(this)">'+item.title+'</a>';
    }).join('');

  // Content
  var content = document.getElementById('content');

  // Hero
  var chips = L.hero.chips.map(function(c){ return '<span class="chip">'+c+'</span>'; }).join('');
  var hero = '<div class="hero"><h1>'+L.hero.title+'</h1><p>'+L.hero.desc+'</p><div class="chips">'+chips+'</div></div>';

  // Sections
  var sections = L.sections.map(function(s){
    return '<section class="section" id="'+s.id+'">' +
      '<div class="section-header"><div class="section-num">'+s.num+'</div><div class="section-title">'+s.title+'</div></div>' +
      s.content +
      '</section>';
  }).join('');

  content.innerHTML = hero + sections +
    '<div class="manual-footer">Smart Waiting Room · Odoo 18 · v1.0.0 · © 2025 Smart Dental Suite</div>';
}

// ── TOC active link ─────────────────────────────────────────────
function setActive(el){
  document.querySelectorAll('.toc-link').forEach(function(a){ a.classList.remove('active'); });
  el.classList.add('active');
}

// Auto-highlight on scroll
var observer = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      var id = e.target.id;
      document.querySelectorAll('.toc-link').forEach(function(a){
        a.classList.toggle('active', a.getAttribute('href') === '#'+id);
      });
    }
  });
}, {threshold:0.3, rootMargin:'-60px 0px -60% 0px'});

render();

// Observe after render
setTimeout(function(){
  document.querySelectorAll('.section').forEach(function(s){ observer.observe(s); });
}, 100);

</script>
</body>
